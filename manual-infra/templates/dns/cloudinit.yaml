#cloud-config
package_update: true
packages:
  - dnsmasq

write_files:
  - path: /etc/dnsmasq.d/restrictedbr0.conf
    permissions: '0644'
    owner: root:root
    content: |
      no-resolv
      server=${dns_forwarder}

      bind-dynamic
      log-queries=extra

      listen-address=127.0.0.1
      listen-address=${dns_ip}

runcmd:
  - systemctl restart dnsmasq
  - systemctl enable dnsmasq
