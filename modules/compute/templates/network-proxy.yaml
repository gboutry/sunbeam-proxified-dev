version: 2
ethernets:
  eth0:
    match: { name: enp5* }
    dhcp4: true
    dhcp4-overrides:
        use-routes: false
    routes:
      - to: default
        via: ${proxy_ip}
        on-link: true
    nameservers:
      addresses: ${nameservers}
      search: ${search_domains}
%{ for i in range(nb_extra_nics) ~}
  eth${i + 1}:
    match: { name: enp${i + 6}* }
    dhcp4: false
%{ endfor ~}
