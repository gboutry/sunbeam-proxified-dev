version: 2
ethernets:
  eth0:
    match: { name: enp5* }
    dhcp4: false
    addresses:
      - ${management_ip}/24
    routes:
      - to: default
        via: ${management_gateway}
        on-link: true
    nameservers:
      addresses: ${nameservers}
      search: ${search_domains}
%{ for i in range(nb_extra_nics) ~}
  eth${i + 1}:
    match: { name: enp${i + 6}* }
    dhcp4: false
%{ endfor ~}
